set timeout=3
play 600 988 1 1319 4

menuentry "Auto-install Ubuntu Server (headless)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall subiquity.autoinstallpath=/cdrom/boot/memtest86+x64.bin ---
	initrd	/casper/initrd
}
menuentry "Try or Install Ubuntu Server" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  ---
	initrd	/casper/initrd
}
