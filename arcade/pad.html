<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gamepad</title>
<style>
  :root { --p: #4da3ff; --bg: #07090f; --pad: #141a28; --line: rgba(255,255,255,.1); --fg: #eef2ff; }
  body.p2 { --p: #ff5470; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font: 600 14px system-ui, -apple-system, sans-serif; overflow: hidden; }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 14px; z-index: 2; }
  .tag { padding: 6px 14px; border-radius: 99px; background: var(--pad); border: 1px solid var(--line); }
  .tag b { color: var(--p); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #f44; display: inline-block; margin-right: 6px; }
  #dot.on { background: #3ddc84; }
  #start { padding: 8px 18px; border-radius: 99px; background: #222b40; border: 1px solid var(--line); color: var(--fg); font: inherit; }
  #start.down { background: var(--p); }
  #stick { position: fixed; left: max(28px, env(safe-area-inset-left)); bottom: 7vh; width: 44vh; height: 44vh; max-width: 260px; max-height: 260px; min-width: 170px; min-height: 170px;
           border-radius: 50%; background: radial-gradient(circle, #1b2235 0 55%, #121827 56%); border: 2px solid var(--line); }
  #knob { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%; border-radius: 50%; background: var(--p); opacity: .85; box-shadow: 0 0 24px var(--p); transition: transform .05s; }
  .arrow { position: absolute; color: rgba(255,255,255,.25); font-size: 20px; }
  #btns { position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: 6vh; display: grid; grid-template-columns: repeat(3, auto); gap: 14px 16px; }
  .b { width: 19vh; height: 19vh; max-width: 92px; max-height: 92px; min-width: 64px; min-height: 64px; border-radius: 50%; background: var(--pad); border: 2px solid var(--line);
       display: grid; place-items: center; font-size: 15px; letter-spacing: .04em; }
  .b.k { border-radius: 30%; }
  .b.down { background: var(--p); border-color: transparent; box-shadow: 0 0 22px var(--p); transform: scale(.94); }
  .row2 { transform: translateX(-34px); }
  #rotate { display: none; position: fixed; inset: 0; background: var(--bg); place-items: center; text-align: center; font-size: 20px; z-index: 9; padding: 30px; }
  @media (orientation: portrait) { #rotate { display: grid; } }
</style>
</head>
<body>
<div id="top"><span class="tag"><span id="dot"></span><b>P__PLAYER__</b> · <span id="who"></span></span><button id="start">START</button></div>
<div id="stick"><span class="arrow" style="left:46%;top:4%">▲</span><span class="arrow" style="left:46%;bottom:4%">▼</span><span class="arrow" style="left:5%;top:44%">◀</span><span class="arrow" style="right:5%;top:44%">▶</span><div id="knob"></div></div>
<div id="btns">
  <div class="b" data-k="lp">LP</div><div class="b" data-k="mp">MP</div><div class="b" data-k="hp">HP</div>
  <div class="b k row2" data-k="lk">LK</div><div class="b k row2" data-k="mk">MK</div><div class="b k row2" data-k="hk">HK</div>
</div>
<div id="rotate"><div>🔄<br><br>Turn your phone sideways<br><small style="opacity:.6">Lock rotation off if it doesn't turn</small></div></div>
<script>
const PLAYER = __PLAYER__, NAME = __NAME__;
document.body.classList.toggle('p2', PLAYER === 2);
document.getElementById('who').textContent = NAME;
let ws, state = {};
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws${location.search}`);
  ws.onopen = () => { document.getElementById('dot').className = 'on'; const s = Object.keys(state).filter((k) => state[k]).map((k) => k + '1'); if (s.length) ws.send(s.join(',')); };
  ws.onclose = () => { document.getElementById('dot').className = ''; setTimeout(connect, 800); };
}
connect();
function set(k, down) {
  if (!!state[k] === down) return;
  state[k] = down;
  if (ws.readyState === 1) ws.send(k + (down ? '1' : '0'));
  if (down && navigator.vibrate) navigator.vibrate(12);
}
// Full screen + no sleeping, after the first touch (browser rule).
let woke = false;
addEventListener('touchstart', async () => {
  if (woke) return; woke = true;
  try { await document.documentElement.requestFullscreen(); await screen.orientation.lock('landscape'); } catch {}
  try { await navigator.wakeLock.request('screen'); } catch {}
}, { passive: true });

// Buttons: every touch is tracked by id, so you can hold a direction and press several buttons at once.
const touches = new Map();          // touch id -> button key or 'stick'
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
function stickMove(t) {
  const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy; const d = Math.hypot(dx, dy), max = r.width * 0.32;
  const kx = d > max ? dx / d * max : dx, ky = d > max ? dy / d * max : dy;
  knob.style.transform = `translate(${kx}px, ${ky}px)`;
  const dead = r.width * 0.12, a = Math.atan2(-dy, dx) * 180 / Math.PI;    // 8-way by angle
  const on = d > dead;
  set('right', on && (a > -67.5 && a < 67.5)); set('left', on && (a > 112.5 || a < -112.5));
  set('up', on && (a > 22.5 && a < 157.5)); set('down', on && (a < -22.5 && a > -157.5));
}
function stickEnd() { knob.style.transform = ''; ['up', 'down', 'left', 'right'].forEach((k) => set(k, false)); }
function target(t) {
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (!el) return null;
  if (el.closest('#stick')) return 'stick';
  if (el.id === 'start') return 'start';
  return el.closest('.b')?.dataset.k || null;
}
function show(k, down) { const el = k === 'start' ? document.getElementById('start') : document.querySelector(`[data-k="${k}"]`); el?.classList.toggle('down', down); }
addEventListener('touchstart', (e) => { for (const t of e.changedTouches) { const k = target(t); if (!k) continue; touches.set(t.identifier, k); if (k === 'stick') stickMove(t); else { set(k, true); show(k, true); } } e.preventDefault(); }, { passive: false });
addEventListener('touchmove', (e) => { for (const t of e.changedTouches) { const k = touches.get(t.identifier);
  if (k === 'stick') stickMove(t);
  else if (k) { const now = target(t); if (now && now !== k && now !== 'stick') { set(k, false); show(k, false); set(now, true); show(now, true); touches.set(t.identifier, now); } } } e.preventDefault(); }, { passive: false });
function end(e) { for (const t of e.changedTouches) { const k = touches.get(t.identifier); touches.delete(t.identifier); if (k === 'stick') stickEnd(); else if (k) { set(k, false); show(k, false); } } }
addEventListener('touchend', end); addEventListener('touchcancel', end);
// Mouse/keyboard fallback for testing on a computer.
addEventListener('mousedown', (e) => { const k = target(e); if (k && k !== 'stick') { set(k, true); show(k, true); addEventListener('mouseup', () => { set(k, false); show(k, false); }, { once: true }); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Object.keys(state).forEach((k) => set(k, false)); stickEnd(); } });
</script>
</body>
</html>
