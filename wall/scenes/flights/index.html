<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight radar</title>
<!-- Flight radar scene for the Mission Control wall. Live planes from proxy.mjs (127.0.0.1:8098).
     ?style=neon|radar  ?demo=1 (recorded sample)  ?r=<km>  ?pitch=<deg>  ?lat=&lon=&name=  ?labels=<n> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#05070d; --fg:#e8eefc; --dim:#7d8aa8; --acc:#3de8ff; --panel:rgba(9,13,24,.78); --line:rgba(120,150,220,.16);
          --font:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; --radius:12px; }
  body.radar { --bg:#010805; --fg:#c4ffdb; --dim:#3f9a63; --acc:#39ff88; --panel:rgba(1,12,6,.82); --line:rgba(57,255,136,.22);
               --font:'JetBrains Mono',ui-monospace,monospace; --radius:2px; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family:var(--font); }
  #map, #fx, #veil { position:fixed; inset:0; }
  #fx, #veil, #cards { pointer-events:none; }
  #veil { background:radial-gradient(ellipse at 38% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  body.radar #veil { background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
                                radial-gradient(ellipse at 38% 50%, transparent 50%, rgba(0,0,0,.7) 100%); }
  .maplibregl-canvas { outline:none; }

  #hud { position:fixed; left:48px; top:40px; }
  #hud, #count { text-shadow:0 0 14px var(--bg), 0 0 6px var(--bg), 0 0 2px var(--bg); }
  #hud::before, #count::before { content:''; position:absolute; inset:-60px -120px -60px -80px; z-index:-1;
    background:radial-gradient(ellipse at 30% 50%, var(--bg) 0%, transparent 70%); opacity:.85; }
  .brand { font-size:15px; letter-spacing:.32em; color:var(--acc); font-weight:600; }
  .place { font-size:52px; font-weight:700; letter-spacing:-.01em; margin:4px 0 2px; }
  body.radar .place { font-size:44px; letter-spacing:.04em; text-transform:uppercase; }
  .clock { font-family:var(--mono); font-size:20px; color:var(--dim); }

  #count { position:fixed; left:48px; bottom:44px; }
  #count .n { font-size:150px; font-weight:700; line-height:.86; letter-spacing:-.04em; color:var(--fg); }
  body.radar #count .n { font-size:128px; letter-spacing:0; color:var(--acc); text-shadow:0 0 18px rgba(57,255,136,.5); }
  #count .lbl { font-size:30px; font-weight:500; margin-top:6px; }
  #count .sub { font-family:var(--mono); font-size:17px; color:var(--dim); margin-top:6px; }
  .legend { margin-top:18px; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; color:var(--dim); }
  .legend i { display:block; width:240px; height:6px; border-radius:3px; }

  #panel { position:fixed; right:32px; top:32px; bottom:32px; width:392px; box-sizing:border-box; padding:22px 22px 16px;
           background:var(--panel); border:1px solid var(--line); border-radius:calc(var(--radius) + 6px); display:flex; flex-direction:column; }
  #panel h2 { margin:0 0 12px; font-size:14px; letter-spacing:.28em; font-weight:600; color:var(--dim); }
  #rows { flex:1; overflow:hidden; }
  .row { display:grid; grid-template-columns:12px 1fr auto; gap:4px 12px; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
  .row .dot { width:10px; height:10px; border-radius:50%; grid-row:span 2; }
  .row .fn { font-weight:600; font-size:20px; }
  .row .fn small { font-family:var(--mono); font-size:12px; color:var(--dim); font-weight:400; margin-left:6px; }
  .row .rt { font-size:15px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; grid-column:2; }
  .row .km { font-family:var(--mono); font-size:18px; text-align:right; }
  .row .alt { font-family:var(--mono); font-size:13px; color:var(--dim); text-align:right; grid-column:3; }
  .row .km b { display:inline-block; font-weight:400; color:var(--dim); margin-left:4px; }
  #status { font-family:var(--mono); font-size:13px; color:var(--dim); padding-top:12px; border-top:1px solid var(--line); }
  #status .live { color:var(--acc); }
  #status .demo { color:#ffb347; }
  #credit { font-size:10.5px; color:var(--dim); opacity:.7; margin-top:6px; line-height:1.4; }

  #alert { position:fixed; top:36px; left:calc((100% - 424px) / 2); transform:translate(-50%, -160%); transition:transform .5s;
           padding:14px 28px; border-radius:999px; background:rgba(255,61,127,.16); border:2px solid #ff3d7f; color:#fff;
           font-size:24px; font-weight:600; white-space:nowrap; box-shadow:0 0 40px rgba(255,61,127,.45); opacity:0; }
  #alert.on { opacity:1; transform:translate(-50%, 0); animation:pulse 1.6s ease-in-out infinite; }
  #alert small { font-family:var(--mono); font-size:16px; font-weight:400; opacity:.85; margin-left:10px; }
  body.radar #alert { border-radius:2px; background:rgba(255,200,40,.12); border-color:#ffd23d; box-shadow:0 0 40px rgba(255,210,61,.35); color:#ffe9a8; }
  @keyframes pulse { 50% { box-shadow:0 0 70px rgba(255,61,127,.75); } }

  .card { position:absolute; left:0; top:0; width:322px; box-sizing:border-box; padding:11px 16px 12px; background:var(--panel);
          border:1px solid var(--line); border-left:4px solid var(--c, var(--acc)); border-radius:var(--radius); will-change:transform; }
  .card .fn { font-size:25px; font-weight:700; line-height:1.1; }
  .card .fn small { font-family:var(--mono); font-size:13px; font-weight:400; color:var(--dim); margin-left:8px; }
  .card .rt { font-size:19px; margin:3px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .rt span { color:var(--dim); font-size:15px; }
  .card .meta { font-family:var(--mono); font-size:15px; color:var(--c, var(--acc)); }
  body.radar .card { border-left-width:1px; border-color:var(--c); box-shadow:0 0 18px rgba(57,255,136,.15); }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>
<div id="veil"></div>
<div id="cards"></div>
<div id="hud"><div class="brand">FLIGHT RADAR</div><div class="place" id="place">…</div><div class="clock" id="clock"></div></div>
<div id="count"><div class="n" id="n">–</div><div class="lbl" id="lbl">planes above you</div><div class="sub" id="sub">&nbsp;</div>
  <div class="legend"><span>0</span><i id="legend"></i><span>12 km</span></div></div>
<div id="alert"></div>
<div id="panel"><h2>NEAREST FLIGHTS</h2><div id="rows"></div><div id="status">starting…</div>
  <div id="credit">Map © OpenFreeMap © OpenMapTiles © OpenStreetMap · ADS-B: adsb.fi / OpenSky / adsb.lol · routes: adsbdb</div></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const STYLE = Q.get('style') === 'radar' ? 'radar' : 'neon';
const DEMO = Q.get('demo') === '1';
const R_KM = Number(Q.get('r')) || 150;
const PITCH = Q.has('pitch') ? Number(Q.get('pitch')) : (STYLE === 'neon' ? 50 : 0);
const LABELS = Q.has('labels') ? Number(Q.get('labels')) : 4;
const OVERHEAD_KM = 5;
const PANEL_W = 424;
const POLL_MS = 15000;
const PROXY = Q.get('proxy') || `${location.protocol}//${location.hostname}:${location.port === '18099' ? 18098 : 8098}`;
document.body.className = STYLE;

// ---------- geo ----------
const RAD = Math.PI / 180, EARTH = 6371;
function dest(lat, lon, brg, km) {
  const d = km / EARTH, b = brg * RAD, p1 = lat * RAD, l1 = lon * RAD;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [p2 / RAD, l2 / RAD];
}
function dist(a, b, c, d) {
  const x = Math.sin((c - a) * RAD / 2) ** 2 + Math.cos(a * RAD) * Math.cos(c * RAD) * Math.sin((d - b) * RAD / 2) ** 2;
  return 2 * EARTH * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d) {
  const y = Math.sin((d - b) * RAD) * Math.cos(c * RAD);
  const x = Math.cos(a * RAD) * Math.sin(c * RAD) - Math.sin(a * RAD) * Math.cos(c * RAD) * Math.cos((d - b) * RAD);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}

// ---------- colours ----------
const STOPS = STYLE === 'radar'
  ? [[0, '#e4ff6a'], [3000, '#a8ff4f'], [7000, '#3dff7a'], [12500, '#3dffd0']]
  : [[0, '#ff3d7f'], [1500, '#ff7a3d'], [3500, '#ffd23d'], [6000, '#7dff6a'], [9000, '#3de8ff'], [12500, '#9a7bff']];
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const STOPS_RGB = STOPS.map(([a, h]) => [a, hex2rgb(h)]);
function altRGB(alt) {
  const s = STOPS_RGB;
  if (alt <= s[0][0]) return s[0][1];
  for (let i = 1; i < s.length; i++) if (alt <= s[i][0]) {
    const k = (alt - s[i - 1][0]) / (s[i][0] - s[i - 1][0]);
    return s[i - 1][1].map((v, j) => Math.round(v + (s[i][1][j] - v) * k));
  }
  return s[s.length - 1][1];
}
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
document.getElementById('legend').style.background = `linear-gradient(90deg, ${STOPS.map(([a, h]) => `${h} ${(a / 12500 * 100).toFixed(0)}%`).join(', ')})`;

// ---------- airlines (fallback when no route is known) ----------
const AIRLINES = {
  IGO: ['IndiGo', '6E'], AIC: ['Air India', 'AI'], AXB: ['Air India Express', 'IX'], SEJ: ['SpiceJet', 'SG'], AKJ: ['Akasa Air', 'QP'],
  VTI: ['Vistara', 'UK'], LLR: ['Alliance Air', '9I'], SDG: ['Star Air', 'S5'], FLG: ['Fly91', 'IC'], BDA: ['Blue Dart', 'BZ'],
  UAE: ['Emirates', 'EK'], ETD: ['Etihad', 'EY'], QTR: ['Qatar Airways', 'QR'], FDB: ['flydubai', 'FZ'], ABY: ['Air Arabia', 'G9'],
  OMA: ['Oman Air', 'WY'], GFA: ['Gulf Air', 'GF'], KAC: ['Kuwait Airways', 'KU'], SVA: ['Saudia', 'SV'], JZR: ['Jazeera', 'J9'],
  SIA: ['Singapore Airlines', 'SQ'], MAS: ['Malaysia Airlines', 'MH'], AXM: ['AirAsia', 'AK'], THA: ['Thai Airways', 'TG'],
  CPA: ['Cathay Pacific', 'CX'], ALK: ['SriLankan', 'UL'], BTN: ['Bhutan Airlines', 'B3'], DRK: ['Druk Air', 'KB'],
  UZB: ['Uzbekistan Airways', 'HY'], THY: ['Turkish Airlines', 'TK'], BAW: ['British Airways', 'BA'], DLH: ['Lufthansa', 'LH'],
  AFR: ['Air France', 'AF'], KLM: ['KLM', 'KL'], FDX: ['FedEx', 'FX'], UPS: ['UPS', '5X'], ETH: ['Ethiopian', 'ET'], RJA: ['Royal Jordanian', 'RJ'],
  AFL: ['Aeroflot', 'SU'], ACA: ['Air Canada', 'AC'], UAL: ['United', 'UA'], AAL: ['American', 'AA'], VIR: ['Virgin Atlantic', 'VS'],
  CES: ['China Eastern', 'MU'], CSN: ['China Southern', 'CZ'], CCA: ['Air China', 'CA'], KAL: ['Korean Air', 'KE'], JAL: ['Japan Airlines', 'JL'],
  ANA: ['ANA', 'NH'], BBC: ['Biman', 'BG'], RNA: ['Nepal Airlines', 'RA'], PIA: ['PIA', 'PK'], AZG: ['Silk Way West', '7L'], HYT: ['YTO Cargo', 'YG'],
};

// ---------- state ----------
let home = { lat: 28.61, lon: 77.21, name: 'New Delhi' };
let map = null, mapReady = false, projEpoch = 0;
const planes = new Map();             // hex → plane
const routes = new Map();             // callsign → route | null | undefined (pending)
let feed = { mode: 'starting', src: '', at: 0, fails: 0, nextAt: 0 };
let demoData = null, demoTimer = null, demoShift = [0, 0];
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');

const fetchJSON = (u) => fetch(u, { cache: 'no-store' }).then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));

// ---------- projection ----------
// MapLibre when it's up; otherwise a flat fallback so planes still show without tiles or WebGL.
function proj(lon, lat) {
  if (mapReady) { const p = map.project([lon, lat]); return [p.x, p.y]; }
  const s = (Math.min(innerHeight, innerWidth - PANEL_W) / 2 - 60) / R_KM;
  const cx = (innerWidth - PANEL_W) / 2, cy = innerHeight / 2;
  return [cx + (lon - home.lon) * 111.32 * Math.cos(home.lat * RAD) * s, cy - (lat - home.lat) * 110.57 * s];
}
// Pixels of "lift" per metre of altitude at a spot (only when the map is tilted).
const EXAG = 3.2;
function liftAt(lon, lat) {
  if (!mapReady || PITCH <= 0) return 0;
  const a = map.project([lon, lat]), b = map.project([lon + 0.05, lat]);
  return Math.abs(b.x - a.x) / (0.05 * 111320 * Math.cos(lat * RAD)) * EXAG * Math.sin(PITCH * RAD);
}

function mapStyle() {
  const C = STYLE === 'radar'
    ? { bg: '#010805', land: '#021309', water: '#03200f', waterLine: '#0d5a30', river: '#0a3f22', road: ['#0f5a2e', '#0b4524', '#08351c'],
        border: '#13633a', runway: '#3dff7a', label: '#2fbf6a', halo: '#010805', apt: '#7dffb0' }
    : { bg: '#06080f', land: '#0b1020', water: '#0b1a33', waterLine: '#16305c', river: '#10264a', road: ['#2a3c66', '#1f2d4d', '#18223a'],
        border: '#2c3656', runway: '#5a7bd6', label: '#7483a6', halo: '#06080f', apt: '#8fd8ff' };
  const name = ['coalesce', ['get', 'name:en'], ['get', 'name']];
  return {
    version: 8,
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': C.bg } },
      { id: 'urban', type: 'fill', source: 'omt', 'source-layer': 'landuse', filter: ['in', ['get', 'class'], ['literal', ['residential', 'commercial', 'industrial', 'suburb', 'neighbourhood']]], paint: { 'fill-color': C.land, 'fill-opacity': 0.9 } },
      { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': C.water } },
      { id: 'water-edge', type: 'line', source: 'omt', 'source-layer': 'water', paint: { 'line-color': C.waterLine, 'line-width': 1 } },
      { id: 'river', type: 'line', source: 'omt', 'source-layer': 'waterway', filter: ['==', ['get', 'class'], 'river'], paint: { 'line-color': C.river, 'line-width': 1.2 } },
      { id: 'border', type: 'line', source: 'omt', 'source-layer': 'boundary', filter: ['all', ['<=', ['get', 'admin_level'], 4], ['!=', ['get', 'maritime'], 1]], paint: { 'line-color': C.border, 'line-width': 1.2, 'line-dasharray': [3, 2] } },
      { id: 'road-3', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['==', ['get', 'class'], 'primary'], paint: { 'line-color': C.road[2], 'line-width': 0.8 } },
      { id: 'road-2', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['==', ['get', 'class'], 'trunk'], paint: { 'line-color': C.road[1], 'line-width': 1.1 } },
      { id: 'road-1', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['==', ['get', 'class'], 'motorway'], paint: { 'line-color': C.road[0], 'line-width': 1.6 } },
      { id: 'runway', type: 'line', source: 'omt', 'source-layer': 'aeroway', filter: ['all', ['==', ['geometry-type'], 'LineString'], ['==', ['get', 'class'], 'runway']], paint: { 'line-color': C.runway, 'line-width': 2.5 } },
      { id: 'runway-poly', type: 'fill', source: 'omt', 'source-layer': 'aeroway', filter: ['all', ['==', ['geometry-type'], 'Polygon'], ['==', ['get', 'class'], 'runway']], paint: { 'fill-color': C.runway } },
      { id: 'towns', type: 'symbol', source: 'omt', 'source-layer': 'place', filter: ['==', ['get', 'class'], 'town'],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': 13, 'text-transform': STYLE === 'radar' ? 'uppercase' : 'none', 'text-letter-spacing': 0.05 },
        paint: { 'text-color': C.label, 'text-opacity': 0.55, 'text-halo-color': C.halo, 'text-halo-width': 1.5 } },
      { id: 'cities', type: 'symbol', source: 'omt', 'source-layer': 'place', filter: ['==', ['get', 'class'], 'city'],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Bold'], 'text-size': 15, 'text-transform': STYLE === 'radar' ? 'uppercase' : 'none', 'text-letter-spacing': 0.08 },
        paint: { 'text-color': C.label, 'text-opacity': 0.8, 'text-halo-color': C.halo, 'text-halo-width': 2 } },
      { id: 'airports', type: 'symbol', source: 'omt', 'source-layer': 'aerodrome_label', filter: ['all', ['has', 'iata'], ['in', ['get', 'class'], ['literal', ['international', 'public', 'regional']]]],
        layout: { 'text-field': ['concat', '✈ ', ['get', 'iata']], 'text-font': ['Noto Sans Bold'], 'text-size': 14, 'text-offset': [0, 1.2] },
        paint: { 'text-color': C.apt, 'text-halo-color': C.halo, 'text-halo-width': 2 } },
    ],
  };
}

// Zoom and pan until the R_KM ring fills the space left of the panel (works tilted too).
function ring(km, n = 96) { const a = []; for (let i = 0; i <= n; i++) { const [la, lo] = dest(home.lat, home.lon, i * 360 / n, km); a.push([lo, la]); } return a; }
function fitRing() {
  const top = PITCH > 0 ? 150 : 56, side = 56, bottom = 40;
  for (let i = 0; i < 12; i++) {
    const pts = ring(R_KM, 48).map((p) => map.project(p));
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
    const ax0 = side, ax1 = innerWidth - PANEL_W - side, ay0 = top, ay1 = innerHeight - bottom;
    const s = Math.min((ax1 - ax0) / (bx1 - bx0), (ay1 - ay0) / (by1 - by0));
    map.panBy([(bx0 + bx1) / 2 - (ax0 + ax1) / 2, (by0 + by1) / 2 - (ay0 + ay1) / 2], { animate: false });
    map.jumpTo({ zoom: map.getZoom() + Math.log2(s) * 0.8 });
  }
  projEpoch++;
}

function setupMap() {
  if (!window.maplibregl) return;
  try {
    map = new maplibregl.Map({
      container: 'map', style: mapStyle(), center: [home.lon, home.lat], pitch: PITCH, maxPitch: 60, bearing: 0,
      zoom: Math.log2(78271.517 * Math.cos(home.lat * RAD) / (R_KM * 1000 / 480)),
      interactive: false, attributionControl: false, fadeDuration: 0,
    });
    map.on('load', () => { fitRing(); mapReady = true; projEpoch++; });
    map.on('error', (e) => console.warn('map', e && e.error && e.error.message));
  } catch (e) { console.warn('no map', e); map = null; }
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (mapReady) { map.resize(); map.jumpTo({ center: [home.lon, home.lat] }); fitRing(); }
  projEpoch++;
}
addEventListener('resize', resize);

// ---------- planes ----------
// Dead reckoning: position = last fix + ground speed along track for the time since the fix (max 90 s).
// When a new fix lands, the gap to where the plane was being drawn is eased out over 2.5 s.
function reckon(s, t) {
  const dt = Math.max(0, Math.min(90, (t - s.base.t) / 1000));
  let [lat, lon] = s.gs > 5 ? dest(s.base.lat, s.base.lon, s.trk, s.gs * dt / 3600) : [s.base.lat, s.base.lon];
  let alt = s.ground ? 0 : Math.max(0, s.base.alt + (s.vr || 0) * Math.min(dt, 45));
  const k = Math.max(0, 1 - (t - s.offT) / 2500);
  if (k > 0) { lat += s.off[0] * k; lon += s.off[1] * k; alt += s.off[2] * k; }
  return { lat, lon, alt };
}

function ingest(list, now) {
  for (const p of list) {
    if (!p.hex || p.lat == null) continue;
    let s = planes.get(p.hex);
    const before = s && s.base ? reckon(s, now) : null;
    if (!s) { s = { hex: p.hex, trail: [], born: now, off: [0, 0, 0], offT: 0, hdg: p.trk || 0 }; planes.set(p.hex, s); }
    Object.assign(s, { cs: p.cs || '', reg: p.reg || '', type: p.type || '', cat: p.cat || '', ground: !!p.ground, gs: p.gs || 0, trk: p.trk || 0, vr: p.vr || 0,
      base: { lat: p.lat + demoShift[0], lon: p.lon + demoShift[1], t: Math.min(p.t || now, now), alt: p.alt || 0 }, seen: now });
    if (before) {
      const after = reckon(s, now);
      const d = [before.lat - after.lat, before.lon - after.lon, before.alt - after.alt];
      if (Math.abs(d[0]) < 0.06 && Math.abs(d[1]) < 0.06) { s.off = d; s.offT = now; } else { s.off = [0, 0, 0]; s.trail = []; }
    }
    if (s.cs && !DEMO && !demoData) wantRoute(s.cs);
  }
}

// Demo: straight-line trail behind each plane so the first frame already looks alive.

// ---------- feed ----------
async function poll() {

    if (demoData) stopDemo();

    + ' · ' + t.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

// ---------- start ----------
(async function init() {
  resize();
  let demo = null;
  if (DEMO) { try { demo = await fetchJSON('demo.json'); home = { ...demo.center }; } catch {} }
  else {
    try { const h = await fetchJSON('home.json'); if (Number.isFinite(h.lat) && Number.isFinite(h.lon)) home = { lat: h.lat, lon: h.lon, name: h.name || 'Home' }; } catch {}
  }
  if (Q.get('lat') && Q.get('lon')) home = { lat: Number(Q.get('lat')), lon: Number(Q.get('lon')), name: Q.get('name') || 'Here' };
  document.getElementById('place').textContent = home.name;
  setupMap();
  if (DEMO) { demoData = demo; startDemo(false); } else poll();
  setInterval(tick, 1000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
